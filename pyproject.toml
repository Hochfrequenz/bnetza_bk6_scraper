[project]
name = "bnetza_bk6_scraper"
description = "Scrapes documents of Bundesnetzagentur Beschlusskammer 6 into a structured, git-diffable mirror"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["bnetza", "bundesnetzagentur", "beschlusskammer", "energy", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # aiohttp>=3.14 removed a positional arg from ClientResponse that aioresponses 0.7.9
    # (latest) still relies on, breaking the test suite. Cap until aioresponses catches up.
    "aiohttp<3.14",
    "beautifulsoup4",
    "lxml",
    "typer",
    "pydantic>=2",
]
dynamic = ["readme", "version"]

[project.scripts]
bnetza-bk6-scraper = "bnetza_bk6_scraper.cli:app"

[project.urls]
Changelog = "https://github.com/Hochfrequenz/bnetza_bk6_scraper/releases"
Homepage = "https://github.com/Hochfrequenz/bnetza_bk6_scraper"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aioresponses==0.7.9",
]
linting = [
    "ruff==0.16.4",
    { include-group = "tests" },
]
type_check = [
    "mypy==2.3.1",
    { include-group = "tests" },
]
spell_check = [
    "codespell==2.4.3",
]
coverage = [
    "coverage==7.16.0",
    { include-group = "tests" },
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "coverage" },
    { include-group = "spell_check" },
    "pre-commit",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
# _version.py is auto-generated by hatch-vcs (git-ignored); no docstring / naming compliance.
# *.md excluded because `ruff format` reformats fenced Python code blocks in docs by
# default, which black/isort never touched.
extend-exclude = ["_version.py", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments
    "PLR0912",  # too-many-branches
    "PLR0915",  # too-many-statements
    "PLR2004",  # magic-value-comparison
]

[tool.ruff.lint.per-file-ignores]
# typer's documented CLI-option idiom is a function call (`typer.Option(...)`) used as a
# parameter default; that's not the mutable-default-argument bug B008 warns about.
"src/bnetza_bk6_scraper/cli.py" = ["B008"]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/bnetza_bk6_scraper/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
